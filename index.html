<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--APP-->
<title>צ׳ק ליסט אימון A/B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14171c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a gym card — sticky A/B switcher on top, exercise rows grouped by muscle, each with two set boxes. */
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --ink: #1b1d21;
  --muted: #6b6f76;
  --line: #dddbd3;
  --accent: #c28a12;      /* brass, from the printed program card */
  --accent-ink: #1b1d21;
  --done: #2f7d4f;
  --done-soft: #e2f0e6;
  --font-display: "Karantina", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --ink: #ecebe6; --muted: #9a9ea6; --line: #2c3038;
    --accent: #e0a92e; --accent-ink: #15130d; --done: #5bbf83; --done-soft: #183224;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --ink: #ecebe6; --muted: #9a9ea6; --line: #2c3038;
  --accent: #e0a92e; --accent-ink: #15130d; --done: #5bbf83; --done-soft: #183224;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px; display: grid; gap: 10px;
  border-bottom: 1px solid var(--line);
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: .9; margin: 0; letter-spacing: .5px; }
h1 b { color: var(--accent); }
.tabs { display: flex; gap: 6px; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 16px; font-weight: 600; font-size: 14px;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .next { font-size: 11px; font-weight: 500; color: var(--accent); margin-inline-start: 4px; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

h2.group {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1;
  margin: 10px 0 -4px;
}

.ex {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px; align-items: center;
}
.ex.complete { border-color: var(--done); background: var(--done-soft); }
.pic { position: relative; width: 96px; aspect-ratio: 4/3; max-width: 100%; border-radius: 10px; overflow: hidden; background: #fff; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s; }
.pic img.b { opacity: 0; }
.pic.flip img.b { opacity: 1; }
.ex-info { min-width: 0; display: grid; gap: 8px; }
.ex-name { font-weight: 600; font-size: 16px; line-height: 1.3; }
.ex-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); direction: ltr; text-align: right; }
.boxes { display: flex; gap: 8px; }
.box {
  display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; font-weight: 500;
}
.box .tick {
  width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--muted);
  display: grid; place-items: center; font-size: 12px; line-height: 1; color: transparent;
}
.box[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
.box[aria-pressed="true"] .tick { border-color: #fff; color: #fff; }

.warm { grid-template-columns: 1fr auto; }
.warm .ex-name small { direction: rtl; }

.primary {
  width: 100%; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 28px; padding: 10px; letter-spacing: .5px; margin-top: 6px;
}
.note { font-size: 13px; color: var(--muted); text-align: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 9;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
}
@media (max-width: 360px) {
  .ex { grid-template-columns: 80px 1fr; }
  .pic { width: 80px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!--/APP-HEAD-->
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>אימון <b id="dayTitle">A</b></h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabA" data-day="A">אימון A</button>
      <button class="tab" role="tab" id="tabB" data-day="B">אימון B</button>
    </div>
    <div class="progress">
      <div class="bar"><i id="barFill"></i></div>
      <span class="num" id="progressTxt">0/0</span>
    </div>
  </header>
  <main id="list" class="wrap" style="margin:0"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';

// ---------- Program (A/B card: 4×/week, 60 min, warmup 5 min, 2 sets per exercise) ----------
const IMG = 'img/';
const SETS = 2;
const EX = {
  legpress: { he: 'לחיצת רגליים במכונה', en: 'Leg Press', img: 'Leg_Press' },
  legext:   { he: 'פשיטת ברכיים במכונה', en: 'Leg Extension', img: 'Leg_Extensions' },
  legcurl:  { he: 'כפיפת ברכיים במכונה', en: 'Leg Curl', img: 'Seated_Leg_Curl' },
  calves:   { he: 'תאומים', en: 'Calf Raise', img: 'Standing_Calf_Raises' },
  dbbench:  { he: 'לחיצת חזה במשקולות', en: 'Dumbbell Bench Press', img: 'Dumbbell_Bench_Press' },
  incdb:    { he: 'לחיצת חזה בשיפוע במשקולות', en: 'Incline Dumbbell Press', img: 'Incline_Dumbbell_Press' },
  pecfly:   { he: 'פרפר חזה במכונה', en: 'Pec Deck / Butterfly', img: 'Butterfly' },
  shpress:  { he: 'לחיצת כתפיים במשקולות', en: 'Dumbbell Shoulder Press', img: 'Dumbbell_Shoulder_Press' },
  lateral:  { he: 'הרחקת כתפיים במשקולות', en: 'Lateral Raise', img: 'Side_Lateral_Raise' },
  pushdown: { he: 'פשיטת מרפקים בכבל קרוס', en: 'Cable Triceps Pushdown', img: 'Triceps_Pushdown' },
  ohext:    { he: 'פשיטת מרפקים במשקולת', en: 'Overhead Dumbbell Extension', img: 'Standing_Dumbbell_Triceps_Extension' },
  latpull:  { he: 'פולי עליון באחיזה רחבה', en: 'Wide-Grip Lat Pulldown', img: 'Wide-Grip_Lat_Pulldown' },
  row:      { he: 'חתירה במכונה', en: 'Machine Row', img: 'Leverage_Iso_Row' },
  pullover: { he: 'פול אובר במשקולת', en: 'Dumbbell Pullover', img: 'Straight-Arm_Dumbbell_Pullover' },
  lowback:  { he: 'גב תחתון במשקולת', en: 'Back Extension', img: 'Hyperextensions_Back_Extensions' },
  reardelt: { he: 'כתף אחורית במכונת פרפר', en: 'Reverse Pec Deck', img: 'Reverse_Machine_Flyes' },
  curl:     { he: 'כפיפת מרפקים במשקולות', en: 'Dumbbell Biceps Curl', img: 'Dumbbell_Bicep_Curl' },
  hammer:   { he: 'כפיפת מרפקים בפטישים', en: 'Hammer Curl', img: 'Hammer_Curls' },
};
const PLAN = {
  A: [
    ['רגליים', ['legpress', 'legext', 'legcurl', 'calves']],
    ['חזה', ['dbbench', 'incdb', 'pecfly']],
    ['כתפיים', ['shpress', 'lateral']],
    ['יד אחורית', ['pushdown', 'ohext']],
  ],
  B: [
    ['רגליים', ['legpress', 'legext', 'legcurl', 'calves']],
    ['גב', ['latpull', 'row', 'pullover', 'lowback']],
    ['כתף אחורית', ['reardelt']],
    ['יד קדמית', ['curl', 'hammer']],
  ],
};

// ---------- Storage: localStorage always, plus the artifact's private db when it is available ----------
// state.checks[day] = { warm: bool, <exId>: [bool, bool] }; state.last = day of the last finished workout
const LS_KEY = 'gymAB.checklist.v1';
let state = { checks: {}, last: null };
function lsRead() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.checks) return s; } catch (e) {} return null; }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

let doc = null, writing = Promise.resolve(), saveTimer = null;
function save() {
  lsWrite();
  if (!doc) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(state));
    writing = writing.then(() => doc.set(body)).catch(err => console.warn('db', err));
  }, 800);
}
async function cloudInit() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    doc = db.doc('data/users/' + uid + '/checklist');
    const snap = await doc.get();
    if (snap.exists && snap.data().checks) { state = JSON.parse(JSON.stringify(snap.data())); lsWrite(); render(); }
    else save();
  } catch (e) { console.warn('db init', e); }
}

// ---------- UI ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }
const nextDay = () => state.last === 'A' ? 'B' : 'A';
let day = null;

function checksFor(d) {
  const c = state.checks[d] || (state.checks[d] = { warm: false });
  PLAN[d].forEach(([, ids]) => ids.forEach(id => {
    if (!Array.isArray(c[id])) c[id] = [];
    while (c[id].length < SETS) c[id].push(false);
    c[id].length = SETS;
  }));
  return c;
}

function boxes(key, arr) {
  return arr.map((on, i) => `<button class="box" aria-pressed="${on}" data-key="${key}" data-i="${i}"><span class="tick">✓</span>סט ${i + 1}</button>`).join('');
}

function render() {
  if (!day) day = nextDay();
  const nd = nextDay();
  ['A', 'B'].forEach(v => {
    const t = $('#tab' + v);
    t.setAttribute('aria-selected', String(v === day));
    t.innerHTML = 'אימון ' + v + (v === nd ? '<span class="next">· הבא</span>' : '');
  });
  $('#dayTitle').textContent = day;
  const c = checksFor(day);
  let html = `
    <div class="ex warm${c.warm ? ' complete' : ''}">
      <div class="ex-name">חימום 5 דקות<small>הליכה / אופניים / אליפטיקל</small></div>
      <div class="boxes"><button class="box" aria-pressed="${c.warm}" data-key="warm"><span class="tick">✓</span>בוצע</button></div>
    </div>`;
  PLAN[day].forEach(([group, ids]) => {
    html += `<h2 class="group">${esc(group)}</h2>`;
    ids.forEach(id => {
      const e = EX[id], done = c[id].every(Boolean);
      html += `
      <article class="ex${done ? ' complete' : ''}" id="ex-${id}">
        <div class="pic"><img src="${IMG}${e.img}_0.jpg" alt="${esc(e.he)}" loading="lazy"><img class="b" src="${IMG}${e.img}_1.jpg" alt="" loading="lazy"></div>
        <div class="ex-info">
          <div class="ex-name">${esc(e.he)}<small>${esc(e.en)}</small></div>
          <div class="boxes">${boxes(id, c[id])}</div>
        </div>
      </article>`;
    });
  });
  html += `<button class="primary" id="finishBtn">סיום אימון ${day}</button>
    <p class="note">הסיום מנקה את הסימונים ומעביר לאימון הבא.</p>`;
  $('#list').innerHTML = html;
  updateProgress();
}

function updateProgress() {
  const c = checksFor(day);
  let total = 1, done = c.warm ? 1 : 0;
  PLAN[day].forEach(([, ids]) => ids.forEach(id => c[id].forEach(on => { total++; if (on) done++; })));
  $('#barFill').style.width = (done / total * 100) + '%';
  $('#progressTxt').textContent = `${done}/${total}`;
}

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  day = b.dataset.day; render(); window.scrollTo(0, 0);
});

$('#list').addEventListener('click', e => {
  const b = e.target.closest('.box');
  if (b) {
    const c = checksFor(day), key = b.dataset.key;
    let on;
    if (key === 'warm') on = c.warm = !c.warm;
    else on = c[key][+b.dataset.i] = !c[key][+b.dataset.i];
    b.setAttribute('aria-pressed', String(on));
    const card = b.closest('.ex');
    card.classList.toggle('complete', key === 'warm' ? c.warm : c[key].every(Boolean));
    updateProgress(); save();
    return;
  }
  if (e.target.id === 'finishBtn') {
    const finished = day;
    state.last = finished;
    delete state.checks[finished];
    day = nextDay();
    save(); render(); window.scrollTo(0, 0);
    toast(`כל הכבוד! אימון ${finished} הושלם. הבא בתור: ${day}`);
  }
});

// Two-frame demo: alternate start/end positions
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => document.querySelectorAll('#list .pic').forEach(p => p.classList.toggle('flip')), 1400);
}

// ---------- Boot ----------
const saved = lsRead();
if (saved) state = saved;
render();
cloudInit();
})();
</script>
</body>
</html>
