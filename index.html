<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--APP-->
<title>יומן אימון A/B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14171c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a gym card — sticky day switcher on top, exercise cards grouped by muscle, rest timer docked at the bottom. */
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --ink: #1b1d21;
  --muted: #6b6f76;
  --line: #dddbd3;
  --accent: #c28a12;      /* brass, from the printed program card */
  --accent-ink: #1b1d21;
  --accent-soft: #f6ead0;
  --done: #2f7d4f;
  --done-soft: #e2f0e6;
  --font-display: "Karantina", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --ink: #ecebe6; --muted: #9a9ea6; --line: #2c3038;
    --accent: #e0a92e; --accent-ink: #15130d; --accent-soft: #33290f; --done: #5bbf83; --done-soft: #183224;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --ink: #ecebe6; --muted: #9a9ea6; --line: #2c3038;
  --accent: #e0a92e; --accent-ink: #15130d; --accent-soft: #33290f; --done: #5bbf83; --done-soft: #183224;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
img { max-width: 100%; display: block; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px; display: grid; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: .9; margin: 0; letter-spacing: .5px; }
h1 b { color: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-weight: 600; font-size: 14px;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .next { font-size: 11px; font-weight: 500; color: var(--accent); margin-inline-start: 4px; }
.tab[aria-selected="true"] .next { color: var(--accent); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Program meta */
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta span b { color: var(--ink); font-weight: 600; }
.warm {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
}
.warm .t { flex: 1; min-width: 0; }
.warm .t small { display: block; color: var(--muted); }

h2.group {
  font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1;
  margin: 8px 0 -6px; display: flex; align-items: baseline; gap: 10px;
}
h2.group small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); }

/* Exercise card */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ex.complete { border-color: var(--done); }
.ex-head { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px; align-items: start; }
.pic { position: relative; width: 112px; aspect-ratio: 4/3; max-width: 100%; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s; }
.pic img.b { opacity: 0; }
.pic.flip img.b { opacity: 1; }
.pic .own { object-fit: cover; }
.pic-btn.alt { inset-inline-start: auto; inset-inline-end: 4px; }
.pic-btn {
  position: absolute; inset-inline-start: 4px; bottom: 4px; border: 0; border-radius: 6px;
  background: rgba(20,22,26,.72); color: #fff; font-size: 11px; padding: 2px 6px;
}
.ex-info { min-width: 0; display: grid; gap: 4px; }
.ex-name { font-weight: 600; font-size: 16px; line-height: 1.3; display: flex; gap: 8px; align-items: start; }
.ex-name .chk {
  margin-inline-start: auto; flex: none; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 14px;
}
.ex.complete .chk { background: var(--done); border-color: var(--done); color: #fff; }
.ex-en { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; background: var(--bg); border-radius: 6px; padding: 1px 7px; color: var(--muted); }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 600; }
.up { font-size: 12.5px; color: var(--ink); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; justify-self: start; }

.boxes { display: flex; gap: 8px; flex-wrap: wrap; }
.box {
  display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; font-weight: 500;
}
.box .tick { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 12px; line-height: 1; color: transparent; }
.box.on { background: var(--done); border-color: var(--done); color: #fff; }
.box.on .tick { border-color: #fff; color: #fff; }
.ex.check-only .ex-head { align-items: center; }
.sets { border-top: 1px solid var(--line); padding: 8px 12px 12px; display: grid; gap: 6px; }
.set-row { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; align-items: center; }
.set-row.hdr { font-size: 11px; color: var(--muted); letter-spacing: .3px; }
.set-row .n { font-family: var(--font-num); color: var(--muted); font-size: 13px; text-align: center; }
.field { position: relative; }
.field input {
  width: 100%; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); padding: 0 10px; font-family: var(--font-num); font-size: 16px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.field input::placeholder { color: var(--muted); opacity: .7; }
.done-btn {
  height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface);
  font-size: 18px; line-height: 1; color: var(--muted);
}
.set-row.on .done-btn { background: var(--done); border-color: var(--done); color: #fff; }
.set-row.on input { background: var(--done-soft); border-color: transparent; }
.set-tools { display: flex; gap: 8px; justify-content: flex-start; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.primary {
  width: 100%; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 28px; padding: 10px; letter-spacing: .5px;
}
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.danger { color: #b3261e; }

/* Rest timer */
.rest {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 12px;
}
.rest .clock { font-family: var(--font-num); font-size: 28px; font-weight: 600; }
.rest .lbl { flex: 1; font-size: 13px; opacity: .8; }
.rest button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; }
.rest.over .clock { color: var(--accent); }

/* History */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; }
.hist-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hist-row .d { color: var(--muted); font-size: 13px; }
.badge { font-family: var(--font-display); font-size: 22px; line-height: 1; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 8px; }
.prog { display: grid; grid-template-columns: 1fr auto 96px; gap: 10px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.prog:first-of-type { border-top: 0; }
.prog .nm { min-width: 0; font-size: 14px; }
.prog svg { width: 96px; height: 28px; overflow: visible; }
.empty { color: var(--muted); font-size: 14px; }
details summary { cursor: pointer; font-weight: 600; }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px; font-family: var(--font-num); font-size: 12px; direction: ltr; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 9;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
}
@media (max-width: 380px) {
  .ex-head { grid-template-columns: 92px 1fr; }
  .pic { width: 92px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!--/APP-HEAD-->
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>אימון <b>A</b></h1>
      <span class="note" id="syncNote"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabA" data-view="A">אימון A</button>
      <button class="tab" role="tab" id="tabB" data-view="B">אימון B</button>
      <button class="tab" role="tab" id="tabH" data-view="H">היסטוריה</button>
    </div>
    <div class="progress" id="progressRow">
      <div class="bar"><i id="barFill"></i></div>
      <span class="num" id="progressTxt">0/0</span>
    </div>
  </header>

  <main id="workout" class="wrap" style="margin:0"></main>
  <section id="history" class="wrap" style="margin:0" hidden></section>
</div>

<div class="rest" id="rest" hidden>
  <span class="clock" id="restClock">1:30</span>
  <span class="lbl" id="restLbl">מנוחה בין סטים</span>
  <button id="restAdd">+30″</button>
  <button id="restSkip">דלג</button>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>
(() => {
'use strict';

// ---------- Program (from the A/B card: 4×/week, 60 min, warmup 5 min, 2 sets × 8-12, 90″ rest, 50-70%) ----------
const IMG = 'img/';
const EX = {
  legpress:  { he: 'לחיצת רגליים במכונה', en: 'Leg Press', img: 'Leg_Press' },
  legext:    { he: 'פשיטת ברכיים במכונה', en: 'Leg Extension', img: 'Leg_Extensions' },
  legcurl:   { he: 'כפיפת ברכיים במכונה', en: 'Leg Curl', img: 'Seated_Leg_Curl' },
  calves:    { he: 'תאומים', en: 'Calf Raise', img: 'Standing_Calf_Raises' },
  dbbench:   { he: 'לחיצת חזה במשקולות', en: 'Dumbbell Bench Press', img: 'Dumbbell_Bench_Press' },
  incdb:     { he: 'לחיצת חזה בשיפוע במשקולות', en: 'Incline Dumbbell Press', img: 'Incline_Dumbbell_Press' },
  pecfly:    { he: 'פרפר חזה במכונה', en: 'Pec Deck / Butterfly', img: 'Butterfly' },
  shpress:   { he: 'לחיצת כתפיים במשקולות', en: 'Dumbbell Shoulder Press', img: 'Dumbbell_Shoulder_Press' },
  lateral:   { he: 'הרחקת כתפיים במשקולות', en: 'Lateral Raise', img: 'Side_Lateral_Raise' },
  pushdown:  { he: 'פשיטת מרפקים בכבל קרוס', en: 'Cable Triceps Pushdown', img: 'Triceps_Pushdown' },
  ohext:     { he: 'פשיטת מרפקים במשקולת', en: 'Overhead Dumbbell Extension', img: 'Standing_Dumbbell_Triceps_Extension' },
  latpull:   { he: 'פולי עליון באחיזה רחבה', en: 'Wide-Grip Lat Pulldown', img: 'Wide-Grip_Lat_Pulldown' },
  row:       { he: 'חתירה במכונה', en: 'Machine Row', img: 'Leverage_Iso_Row' },
  pullover:  { he: 'פול אובר במשקולת', en: 'Dumbbell Pullover', img: 'Straight-Arm_Dumbbell_Pullover' },
  lowback:   { he: 'גב תחתון במשקולת', en: 'Back Extension', img: 'Hyperextensions_Back_Extensions' },
  reardelt:  { he: 'כתף אחורית במכונת פרפר', en: 'Reverse Pec Deck', img: 'Reverse_Machine_Flyes' },
  curl:      { he: 'כפיפת מרפקים במשקולות', en: 'Dumbbell Biceps Curl', img: 'Dumbbell_Bicep_Curl' },
  hammer:    { he: 'כפיפת מרפקים בפטישים', en: 'Hammer Curl', img: 'Hammer_Curls' },
  crunch:    { he: 'ישר בטן', en: 'Crunch', img: 'Crunches', bw: true },
  revcrunch: { he: 'בטן תחתונה', en: 'Reverse Crunch', img: 'Reverse_Crunch', bw: true },
  russian:   { he: 'אלכסונים', en: 'Russian Twist', img: 'Russian_Twist', bw: true },
};
const PLAN = {
  A: [
    ['רגליים', ['legpress', 'legext', 'legcurl', 'calves']],
    ['חזה', ['dbbench', 'incdb', 'pecfly']],
    ['כתפיים', ['shpress', 'lateral']],
    ['יד אחורית', ['pushdown', 'ohext']],
    ['בטן', ['crunch', 'revcrunch', 'russian']],
  ],
  B: [
    ['רגליים', ['legpress', 'legext', 'legcurl', 'calves']],
    ['גב', ['latpull', 'row', 'pullover', 'lowback']],
    ['כתף אחורית', ['reardelt']],
    ['יד קדמית', ['curl', 'hammer']],
    ['בטן', ['crunch', 'revcrunch', 'russian']],
  ],
};
const SETS_DEFAULT = 2, SETS_MAX = 2, REP_TOP = 12, REST_SEC = 90;

// ---------- Storage: localStorage always, plus the artifact's private db when it is available ----------
const LS_KEY = 'gymAB.v1';
let state = { sessions: [], drafts: {}, photos: {} };
function lsRead() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && Array.isArray(s.sessions)) return s; } catch (e) {} return null; }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

const cloud = { db: null, base: null, queues: {} };
function cloudWrite(path, fn) {
  if (!cloud.db) return;
  const prev = cloud.queues[path] || Promise.resolve();
  cloud.queues[path] = prev.then(fn).catch(err => { console.warn('db', path, err); setSync('לא נשמר בענן'); });
}
async function cloudInit() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    cloud.db = db;
    cloud.base = db.doc('data/users/' + uid + '/app');
    const [meta, ses, pho] = await Promise.all([
      cloud.base.get(), cloud.base.collection('sessions').get(), cloud.base.collection('photos').get(),
    ]);
    const remote = {
      drafts: (meta.exists && meta.data().drafts) || {},
      sessions: ses.docs.map(d => d.data()).filter(Boolean),
      photos: {},
    };
    pho.docs.forEach(d => { const v = d.data(); if (v && v.src) remote.photos[d.id] = v.src; });
    // First cloud visit from a browser that already has a log: upload it.
    if (!remote.sessions.length && state.sessions.length) {
      state.sessions.forEach(saveSessionRemote);
      Object.entries(state.photos).forEach(([k, v]) => savePhotoRemote(k, v));
      saveDraftsRemote();
    } else {
      Object.values(remote.drafts).forEach(d => d && d.ex && Object.values(d.ex).forEach(sets => sets.splice(SETS_MAX)));
      state = remote;
      lsWrite();
    }
    setSync('נשמר בחשבון שלך');
    render();
  } catch (e) { console.warn('db init', e); }
}
function saveSessionRemote(s) { cloudWrite('s/' + s.id, () => cloud.base.collection('sessions').doc(s.id).set(s)); }
function saveDraftsRemote() { const d = JSON.parse(JSON.stringify(state.drafts)); cloudWrite('meta', () => cloud.base.set({ drafts: d })); }
function savePhotoRemote(id, src) {
  cloudWrite('p/' + id, () => src ? cloud.base.collection('photos').doc(id).set({ src }) : cloud.base.collection('photos').doc(id).delete());
}
let draftTimer = null;
function saveDrafts() {
  lsWrite();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftsRemote, 1200);
}

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });
const sorted = () => state.sessions.slice().sort((a, b) => a.date < b.date ? 1 : -1);
function setSync(t) { $('#syncNote').textContent = t; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

function lastFor(exId) {
  for (const s of sorted()) if (s.ex && s.ex[exId] && s.ex[exId].length) return { date: s.date, sets: s.ex[exId] };
  return null;
}
function nextDay() { const l = sorted()[0]; return l && l.day === 'A' ? 'B' : 'A'; }

function draftFor(day) {
  let d = state.drafts[day];
  if (!d) {
    d = { start: null, warm: false, ex: {} };
    PLAN[day].forEach(([, ids]) => ids.forEach(id => {
      const last = lastFor(id);
      const n = last ? Math.min(Math.max(last.sets.length, SETS_DEFAULT), SETS_MAX) : SETS_DEFAULT;
      d.ex[id] = Array.from({ length: n }, (_, i) => {
        const p = last && (last.sets[i] || last.sets[last.sets.length - 1]);
        return { w: p && p.w !== '' && p.w != null ? String(p.w) : '', r: '', done: false };
      });
    }));
    state.drafts[day] = d;
  }
  return d;
}

// ---------- Rendering ----------
let view = null;
function render() {
  if (!view) view = nextDay();
  ['A', 'B', 'H'].forEach(v => $('#tab' + v).setAttribute('aria-selected', String(view === v)));
  const nd = nextDay();
  ['A', 'B'].forEach(v => { $('#tab' + v).innerHTML = 'אימון ' + v + (v === nd ? '<span class="next">· הבא</span>' : ''); });
  $('#workout').hidden = view === 'H';
  $('#history').hidden = view !== 'H';
  $('#progressRow').hidden = view === 'H';
  $('h1').innerHTML = view === 'H' ? 'היסטוריה' : 'אימון <b>' + view + '</b>';
  if (view === 'H') renderHistory(); else renderWorkout(view);
}

function picHTML(id) {
  const e = EX[id], own = state.photos[id];
  const imgs = own
    ? `<img class="own" src="${esc(own)}" alt="${esc(e.he)}">`
    : `<img src="${IMG}${e.img}_0.jpg" alt="${esc(e.he)}" loading="lazy"><img class="b" src="${IMG}${e.img}_1.jpg" alt="" loading="lazy">`;
  return `<div class="pic${own ? ' own-pic' : ''}">${imgs}<button class="pic-btn" data-photo="${id}" aria-label="החלפת תמונה">${own ? 'החלף' : 'תמונה'}</button>${own ? `<button class="pic-btn alt" data-photoreset="${id}">מקורית</button>` : ''}</div>`;
}

function renderWorkout(day) {
  const d = draftFor(day);
  let html = `
    <div class="meta">
      <span><b>2</b> סטים</span><span><b>8-12</b> חזרות</span><span><b>90″</b> מנוחה</span><span><b>50-70%</b> משקל</span><span><b>60</b> דק׳ לאימון</span>
    </div>
    <label class="warm">
      <input type="checkbox" id="warmChk" ${d.warm ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--done)">
      <span class="t"><b>חימום 5 דקות</b><small>הליכה / אופניים / אליפטיקל</small></span>
    </label>`;
  PLAN[day].forEach(([group, ids]) => {
    html += `<h2 class="group">${esc(group)} <small>${ids.length} תרגילים</small></h2>`;
    ids.forEach(id => { html += exHTML(day, id); });
  });
  html += `<button class="primary" id="finishBtn">סיום אימון ${day}</button>
    <div class="row"><button class="link" id="resetDay">איפוס האימון הנוכחי</button></div>`;
  $('#workout').innerHTML = html;
  updateProgress(day);
}

function exHTML(day, id) {
  const e = EX[id], sets = state.drafts[day].ex[id], last = lastFor(id);
  const complete = sets.length && sets.every(s => s.done);
  if (e.bw) return `
  <article class="ex check-only${complete ? ' complete' : ''}" id="ex-${id}">
    <div class="ex-head">
      ${picHTML(id)}
      <div class="ex-info">
        <div class="ex-name"><span>${esc(e.he)}</span><span class="chk" aria-hidden="true">✓</span></div>
        <div class="ex-en">${esc(e.en)}</div>
        <div class="boxes">${sets.map((s, i) => `<button class="box${s.done ? ' on' : ''}" data-ex="${id}" data-i="${i}" data-done aria-pressed="${s.done}"><span class="tick">✓</span>סט ${i + 1}</button>`).join('')}</div>
      </div>
    </div>
  </article>`;
  let lastTxt = '';
  let upTxt = '';
  if (last) {
    const s = last.sets.map(x => (e.bw && !x.w ? '' : `${x.w}×`) + (x.r || '?')).join(' · ');
    lastTxt = `<div class="last">פעם קודמת (${fmtDate(last.date)}): <b class="num">${esc(s)}</b></div>`;
    if (!e.bw && last.sets.length && last.sets.every(x => +x.r >= REP_TOP)) upTxt = `<div class="up">הגעת ל-${REP_TOP} חזרות בכל הסטים. אפשר להעלות משקל.</div>`;
  }
  const rows = sets.map((s, i) => `
    <div class="set-row${s.done ? ' on' : ''}" data-ex="${id}" data-i="${i}">
      <span class="n">${i + 1}</span>
      <span class="field"><input id="w-${day}-${id}-${i}" inputmode="decimal" placeholder="${e.bw ? 'גוף' : 'ק״ג'}" value="${esc(s.w)}" data-k="w" aria-label="משקל סט ${i + 1}"></span>
      <span class="field"><input id="r-${day}-${id}-${i}" inputmode="numeric" placeholder="8-12" value="${esc(s.r)}" data-k="r" aria-label="חזרות סט ${i + 1}"></span>
      <button class="done-btn" data-done aria-label="סמן סט ${i + 1} כבוצע">✓</button>
    </div>`).join('');
  return `
  <article class="ex${complete ? ' complete' : ''}" id="ex-${id}">
    <div class="ex-head">
      ${picHTML(id)}
      <div class="ex-info">
        <div class="ex-name"><span>${esc(e.he)}</span><span class="chk" aria-hidden="true">✓</span></div>
        <div class="ex-en">${esc(e.en)}</div>
        ${lastTxt}${upTxt}
      </div>
    </div>
    <div class="sets">
      <div class="set-row hdr"><span>סט</span><span>משקל (ק״ג)</span><span>חזרות</span><span></span></div>
      ${rows}
      <div class="set-tools">
        ${sets.length < SETS_MAX ? `<button class="link" data-add="${id}">+ סט נוסף</button>` : ''}
        ${sets.length > 1 ? `<button class="link" data-del="${id}">הסר סט</button>` : ''}
      </div>
    </div>
  </article>`;
}

function updateProgress(day) {
  const d = state.drafts[day];
  let total = 0, done = 0;
  Object.values(d.ex).forEach(sets => sets.forEach(s => { total++; if (s.done) done++; }));
  $('#barFill').style.width = (total ? done / total * 100 : 0) + '%';
  $('#progressTxt').textContent = `${done}/${total} סטים`;
}

function spark(points) {
  if (points.length < 2) return '<svg viewBox="0 0 96 28"></svg>';
  const min = Math.min(...points), max = Math.max(...points), span = max - min || 1;
  const xy = points.map((p, i) => [i / (points.length - 1) * 92 + 2, 24 - (p - min) / span * 20]);
  const line = xy.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const [lx, ly] = xy[xy.length - 1];
  return `<svg viewBox="0 0 96 28" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--accent)"/></svg>`;
}

function renderHistory() {
  const list = sorted();
  const weekAgo = Date.now() - 7 * 864e5;
  const thisWeek = list.filter(s => new Date(s.date).getTime() > weekAgo).length;
  let html = `<div class="card">
      <div class="hist-row"><h3>השבוע</h3><span class="num">${thisWeek}/4 אימונים</span></div>
      <div class="bar"><i style="width:${Math.min(thisWeek / 4, 1) * 100}%"></i></div>
    </div>`;

  // Progress per exercise: top weight per session, oldest → newest
  const rows = Object.keys(EX).filter(id => !EX[id].bw).map(id => {
    const pts = list.slice().reverse()
      .map(s => s.ex && s.ex[id] ? Math.max(...s.ex[id].map(x => +x.w || 0)) : null)
      .filter(v => v != null && v > 0);
    return { id, pts };
  }).filter(r => r.pts.length);
  html += `<div class="card"><h3>התקדמות במשקל</h3>${rows.length ? rows.map(r => {
    const first = r.pts[0], now = r.pts[r.pts.length - 1], diff = now - first;
    return `<div class="prog"><span class="nm">${esc(EX[r.id].he)}</span><span class="num">${now} ק״ג${diff ? ` <small style="color:var(--done)">${diff > 0 ? '+' : ''}${diff}</small>` : ''}</span>${spark(r.pts)}</div>`;
  }).join('') : '<p class="empty">אחרי האימון הראשון יופיע כאן המשקל הגבוה בכל תרגיל, והגרף יתמלא מאימון לאימון.</p>'}</div>`;

  html += `<div class="card"><h3>אימונים שהושלמו</h3>${list.length ? list.map(s => {
    const n = Object.values(s.ex || {}).reduce((a, x) => a + x.length, 0);
    return `<details><summary><span class="hist-row" style="display:inline-flex;width:calc(100% - 20px)"><span><span class="badge">${s.day}</span> ${fmtDate(s.date)}</span><span class="d num">${n} סטים${s.min ? ' · ' + s.min + ' דק׳' : ''}</span></span></summary>
      <div style="padding-top:8px;display:grid;gap:4px">${Object.entries(s.ex || {}).map(([id, sets]) => `<div class="hist-row"><span>${esc(EX[id] ? EX[id].he : id)}</span><span class="num d">${EX[id] && EX[id].bw ? '✓ ' + sets.length + ' סטים' : sets.map(x => (x.w ? x.w + '×' : '') + (x.r || '?')).join(' · ')}</span></div>`).join('')}
      <button class="link danger" data-delsession="${s.id}">מחיקת האימון</button></div></details>`;
  }).join('') : '<p class="empty">עוד לא נשמרו אימונים. סמן סטים באימון A או B ולחץ "סיום אימון".</p>'}</div>`;

  html += `<div class="card"><details><summary>גיבוי ושחזור</summary>
      <div style="display:grid;gap:8px;padding-top:8px">
        <p class="note">העתק את הגיבוי ושמור אותו בצד. כדי לשחזר, הדבק גיבוי בתיבה ולחץ "שחזור".</p>
        <textarea id="backupTxt" spellcheck="false"></textarea>
        <div class="row"><button class="ghost" id="copyBackup">העתקת גיבוי</button><button class="ghost" id="restoreBackup">שחזור מהתיבה</button></div>
      </div></details></div>`;
  $('#history').innerHTML = html;
}

// ---------- Rest timer ----------
let restEnd = 0, restTick = null;
function startRest(sec) {
  restEnd = Date.now() + sec * 1000;
  $('#rest').hidden = false;
  clearInterval(restTick);
  restTick = setInterval(drawRest, 250);
  drawRest();
}
function drawRest() {
  const left = Math.round((restEnd - Date.now()) / 1000);
  const a = Math.abs(left);
  $('#restClock').textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
  $('#rest').classList.toggle('over', left < 0);
  $('#restLbl').textContent = left < 0 ? 'זמן לסט הבא' : 'מנוחה בין סטים';
  if (left === 0 && navigator.vibrate) { try { navigator.vibrate(300); } catch (e) {} }
  if (left < -120) stopRest();
}
function stopRest() { clearInterval(restTick); $('#rest').hidden = true; }
$('#restSkip').onclick = stopRest;
$('#restAdd').onclick = () => { restEnd += 30000; drawRest(); };

// ---------- Events ----------
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  view = b.dataset.view; render(); window.scrollTo(0, 0);
});

const W = $('#workout');
W.addEventListener('input', e => {
  const inp = e.target;
  if (inp.id === 'warmChk') return;
  const row = inp.closest('.set-row'); if (!row || !inp.dataset.k) return;
  const d = draftFor(view);
  d.ex[row.dataset.ex][+row.dataset.i][inp.dataset.k] = inp.value.replace(',', '.').trim();
  if (!d.start) d.start = new Date().toISOString();
  saveDrafts();
});
W.addEventListener('change', e => {
  if (e.target.id !== 'warmChk') return;
  const d = draftFor(view); d.warm = e.target.checked; if (!d.start) d.start = new Date().toISOString(); saveDrafts();
});
W.addEventListener('click', e => {
  const t = e.target;
  const d = view !== 'H' ? draftFor(view) : null;
  if (t.closest('[data-done]')) {
    const row = t.closest('[data-i]'), id = row.dataset.ex, set = d.ex[id][+row.dataset.i];
    set.done = !set.done;
    if (!d.start) d.start = new Date().toISOString();
    row.classList.toggle('on', set.done);
    if (row.classList.contains('box')) row.setAttribute('aria-pressed', String(set.done));
    const card = $('#ex-' + id);
    card.classList.toggle('complete', d.ex[id].every(s => s.done));
    updateProgress(view);
    saveDrafts();
    if (set.done) startRest(REST_SEC);
    return;
  }
  const add = t.closest('[data-add]'), del = t.closest('[data-del]');
  if (add || del) {
    const id = (add || del).dataset[add ? 'add' : 'del'], sets = d.ex[id];
    if (add && sets.length < SETS_MAX) { const p = sets[sets.length - 1]; sets.push({ w: p ? p.w : '', r: '', done: false }); }
    if (del && sets.length > 1) sets.pop();
    saveDrafts();
    $('#ex-' + id).outerHTML = exHTML(view, id);
    updateProgress(view);
    return;
  }
  const ph = t.closest('[data-photo]');
  const pr = t.closest('[data-photoreset]');
  if (pr) { const id = pr.dataset.photoreset; delete state.photos[id]; lsWrite(); savePhotoRemote(id, null); render(); toast('חזרה לתמונה המקורית'); return; }
  if (ph) { photoTarget = ph.dataset.photo; $('#photoInput').value = ''; $('#photoInput').click(); return; }
  if (t.id === 'finishBtn') return finish(view);
  if (t.id === 'resetDay') {
    if (t.dataset.armed) { delete state.drafts[view]; saveDrafts(); render(); toast('האימון אופס'); }
    else { t.dataset.armed = '1'; t.textContent = 'לחץ שוב לאישור האיפוס'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'איפוס האימון הנוכחי'; } }, 3000); }
  }
});

function finish(day) {
  const d = draftFor(day), ex = {};
  Object.entries(d.ex).forEach(([id, sets]) => {
    const done = sets.filter(s => s.done).map(s => ({ w: s.w, r: s.r }));
    if (done.length) ex[id] = done;
  });
  if (!Object.keys(ex).length) { toast('סמן לפחות סט אחד לפני סיום'); return; }
  const now = new Date();
  const min = d.start ? Math.max(1, Math.round((now - new Date(d.start)) / 60000)) : null;
  const s = { id: 's' + now.getTime(), day, date: now.toISOString(), min: min && min < 240 ? min : null, ex };
  state.sessions.push(s);
  delete state.drafts[day];
  lsWrite(); saveSessionRemote(s); saveDraftsRemote();
  stopRest();
  view = 'H'; render(); window.scrollTo(0, 0);
  toast(`אימון ${day} נשמר. הבא בתור: ${day === 'A' ? 'B' : 'A'}`);
}

// History actions
$('#history').addEventListener('click', async e => {
  const t = e.target;
  const ds = t.closest('[data-delsession]');
  if (ds) {
    if (!ds.dataset.armed) { ds.dataset.armed = '1'; ds.textContent = 'לחץ שוב למחיקה'; return; }
    const id = ds.dataset.delsession;
    state.sessions = state.sessions.filter(s => s.id !== id);
    lsWrite(); cloudWrite('s/' + id, () => cloud.base.collection('sessions').doc(id).delete());
    render(); return;
  }
  if (t.id === 'copyBackup') {
    const txt = JSON.stringify({ sessions: state.sessions });
    const ta = $('#backupTxt'); ta.value = txt;
    try { await navigator.clipboard.writeText(txt); toast('הגיבוי הועתק'); }
    catch (err) { ta.select(); toast('הגיבוי בתיבה. סמן והעתק ידנית'); }
  }
  if (t.id === 'restoreBackup') {
    try {
      const data = JSON.parse($('#backupTxt').value);
      if (!Array.isArray(data.sessions)) throw 0;
      const have = new Set(state.sessions.map(s => s.id));
      const add = data.sessions.filter(s => s && s.id && s.day && s.date && !have.has(s.id));
      state.sessions.push(...add); lsWrite(); add.forEach(saveSessionRemote);
      render(); toast(`שוחזרו ${add.length} אימונים`);
    } catch (err) { toast('הטקסט בתיבה אינו גיבוי תקין'); }
  }
});

// Own photo per exercise (resized so it stays small)
let photoTarget = null;
$('#photoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f || !photoTarget) return;
  const id = photoTarget, url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const s = Math.min(1, 480 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const src = c.toDataURL('image/jpeg', .8);
    state.photos[id] = src; lsWrite(); savePhotoRemote(id, src);
    render(); toast('התמונה עודכנה');
  };
  im.onerror = () => toast('לא הצלחתי לפתוח את הקובץ הזה כתמונה');
  im.src = url;
});

// Two-frame demo: alternate start/end positions
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => document.querySelectorAll('#workout .pic:not(.own-pic)').forEach(p => p.classList.toggle('flip')), 1400);
}
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

// ---------- Boot ----------
const saved = lsRead();
if (saved) state = { sessions: saved.sessions, drafts: saved.drafts || {}, photos: saved.photos || {} };
// Drafts started under an older set count keep at most SETS_MAX sets
Object.values(state.drafts).forEach(d => d && d.ex && Object.values(d.ex).forEach(sets => sets.splice(SETS_MAX)));
render();
cloudInit();
})();
</script>
</body>
</html>
