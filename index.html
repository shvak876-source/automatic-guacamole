<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="אימון A/B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!--APP-->
<title>יומן אימון A/B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0c0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a gym card — sticky day switcher on top, a folder per muscle group that opens to its exercise cards, rest timer docked at the bottom. */
:root {
  --bg: #0b0c0f;
  --surface: #15171c;
  --surface-2: #1c1f26;
  --ink: #f3f4f6;
  --muted: #8b919c;
  --line: #262a32;
  --accent: #ffb020;      /* amber */
  --accent-2: #ff6a1a;    /* orange, the far end of the accent gradient */
  --accent-ink: #160f02;
  --accent-soft: #3a2a0c;
  --done: #22c55e;
  --done-soft: #0f2e1b;
  --both: #ff4d3d;
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --glow: 255,130,30;     /* rgb of the accent's shadow */
  --font-display: "Karantina", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 14px;
  color-scheme: dark;
}
/* Accent colours and a light mode, picked in settings */
:root[data-accent="blue"]   { --accent: #38bdf8; --accent-2: #6366f1; --accent-ink: #03111c; --accent-soft: #0c2a3a; --glow: 80,140,255; }
:root[data-accent="green"]  { --accent: #a3e635; --accent-2: #16a34a; --accent-ink: #0a1402; --accent-soft: #1e2e0a; --glow: 120,220,60; }
:root[data-accent="red"]    { --accent: #ff6b5f; --accent-2: #e11d48; --accent-ink: #1a0507; --accent-soft: #3a1014; --glow: 240,60,70; }
:root[data-accent="purple"] { --accent: #d08cff; --accent-2: #7c3aed; --accent-ink: #12041f; --accent-soft: #2a1440; --glow: 150,80,240; }
:root[data-accent="gold"]   { --accent: #e0a92e; --accent-2: #c28a12; --accent-ink: #15130d; --accent-soft: #33290f; --glow: 200,150,40; }
:root[data-mode="light"] {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f8fa; --ink: #111318; --muted: #626a75; --line: #e1e3e8;
  --done: #16a34a; --done-soft: #dcfce7; color-scheme: light;
}
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; outline: 1px solid var(--line); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
/* One dark theme in every mode: the app is used in the gym, not at a desk */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  background: radial-gradient(120% 60% at 50% -10%, rgba(var(--glow),.13), transparent 60%) no-repeat, var(--bg);
  background-attachment: fixed;
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
img { max-width: 100%; display: block; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px; display: grid; gap: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: .9; margin: 0; letter-spacing: .5px; }
h1 b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-weight: 600; font-size: 14px;
}
.tab[aria-selected="true"] { background: var(--grad); color: var(--accent-ink); border-color: transparent; }
.tab .next { font-size: 11px; font-weight: 500; color: var(--accent); margin-inline-start: 4px; }
.tab[aria-selected="true"] .next { color: var(--accent-ink); opacity: .75; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--grad); transition: width .3s; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Program meta */
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta span b { color: var(--ink); font-weight: 600; }
.warm {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px;
}
.warm .t { flex: 1; min-width: 0; }
.warm .t small { display: block; color: var(--muted); }

.folder { display: grid; gap: 10px; scroll-margin-top: 150px; }
.folder-head {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: start;
  background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px;
}
.folder-head .fname { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; }
.folder-head .fmeta { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.folder-head .fcount { font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.folder-head .arrow { flex: none; width: 10px; height: 10px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform .2s; margin-top: -4px; }
.folder.open .folder-head { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 8px 24px -12px rgba(var(--glow),.5); }
.folder.open .folder-head .arrow { transform: rotate(-135deg); margin-top: 4px; }
.folder.done .folder-head { border-color: var(--done); background: var(--done-soft); }
.folder.done .fcount { color: var(--done); font-weight: 600; }
.folder-body { display: grid; gap: 10px; padding-inline-start: 10px; border-inline-start: 2px solid var(--line); }

/* Exercise card */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ex.complete { border-color: var(--done); }
.ex-head { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 10px 10px 8px; align-items: center; }
.pic { position: relative; width: 64px; aspect-ratio: 4/3; max-width: 100%; border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s; }
.pic img.b { opacity: 0; }
.pic.flip img.b { opacity: 1; }
.pic .own { object-fit: cover; }
.pic .noimg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); }
.pic:has(.noimg) { background: var(--surface-2); }
.pic-btn.alt { inset-inline-start: auto; inset-inline-end: 4px; }
.pic-btn {
  position: absolute; inset-inline-start: 4px; bottom: 4px; border: 0; border-radius: 6px;
  background: rgba(20,22,26,.72); color: #fff; font-size: 9px; padding: 0 4px;
}
.ex-info { min-width: 0; display: grid; gap: 4px; }
.ex-name { font-weight: 600; font-size: 16px; line-height: 1.3; display: flex; gap: 8px; align-items: start; }
.ex-name .chk {
  margin-inline-start: auto; flex: none; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 14px;
}
.ex.complete .chk { background: var(--done); border-color: var(--done); color: #fff; }
.ex-en { font-size: 12px; color: var(--muted); direction: ltr; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; background: var(--bg); border-radius: 6px; padding: 1px 7px; color: var(--muted); }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 600; }
.up { font-size: 12.5px; color: var(--ink); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; justify-self: start; }

.sets { padding: 0 10px 10px; display: grid; gap: 6px; }
.field[data-u]::after { content: attr(data-u); position: absolute; inset-inline-end: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
.set-row { display: grid; grid-template-columns: 18px 1fr 1fr 48px; gap: 8px; align-items: center; }
.set-row.hdr { font-size: 11px; color: var(--muted); letter-spacing: .3px; }
.set-row .n { font-family: var(--font-num); color: var(--muted); font-size: 13px; text-align: center; }
.field { position: relative; }
.field input {
  width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); padding: 0 10px; font-family: var(--font-num); font-size: 16px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.field input::placeholder { color: var(--muted); opacity: .7; }
.done-btn {
  height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface);
  font-size: 18px; line-height: 1; color: var(--muted);
}
.set-row.on .done-btn { background: var(--done); border-color: var(--done); color: #04120a; box-shadow: 0 4px 14px -6px var(--done); }
.set-row.on input { background: var(--done-soft); border-color: transparent; }
.set-tools { display: flex; gap: 8px; justify-content: flex-start; }
.link { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.primary {
  width: 100%; border: 0; border-radius: var(--radius); background: var(--grad); color: var(--accent-ink);
  box-shadow: 0 10px 28px -12px rgba(var(--glow),.7);
  font-family: var(--font-display); font-weight: 700; font-size: 28px; padding: 10px; letter-spacing: .5px;
}
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.danger { color: #b3261e; }

/* Rest timer */
.rest {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--grad); color: var(--accent-ink); display: flex; align-items: center; gap: 12px;
  box-shadow: 0 -8px 24px -10px rgba(var(--glow),.6);
}
.rest .clock { font-family: var(--font-num); font-size: 28px; font-weight: 600; }
.rest .lbl { flex: 1; font-size: 13px; opacity: .8; }
.rest button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 10px; }
.rest.over { background: var(--done); color: #04120a; }
.rest .lbl { font-weight: 600; }

/* History */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; }
.hist-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hist-row .d { color: var(--muted); font-size: 13px; }
.badge { font-family: var(--font-display); font-size: 22px; line-height: 1; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 8px; }
.heat-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.heat-stats b { display: block; font-family: var(--font-num); font-size: 22px; color: var(--accent); }
.heat-stats span { font-size: 12px; color: var(--muted); }
.heat-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.heat-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-inline-end: 5px; background: var(--accent); }
.heat-legend i.both { background: var(--both); }
.heat-year { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
.heat-year .hist-row { font-size: 14px; }
.heat { margin-inline: -8px; }
.heat svg { display: block; width: 100%; height: auto; direction: ltr; }
.heat .lbl { font-size: 8.5px; fill: var(--muted); font-family: inherit; }
.heat .c { fill: var(--line); }
.heat .c.on { fill: var(--accent); }
.heat .c.both { fill: var(--both); }
.heat .c.today { stroke: var(--ink); stroke-width: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.set-ex { display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.set-ex:first-of-type { border-top: 0; }
.set-ex .pic { width: 52px; }
.set-ex.off .pic, .set-ex.off input[type=text] { opacity: .4; }
.set-ex input[type=text] { width: 100%; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; }
.save-nag { width: 100%; border: 0; border-radius: var(--radius); padding: 12px 14px; background: var(--both); color: #fff; font-weight: 500; text-align: start; }
.save-nag b { text-decoration: underline; }
.add-ex { justify-self: start; border-style: dashed; color: var(--accent); }
.set-ex .sub { font-size: 11px; color: var(--muted); padding-top: 2px; }
.switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line); justify-self: end; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-end: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-end .15s; }
.switch[aria-checked="true"] { background: var(--done); }
.switch[aria-checked="true"]::after { inset-inline-end: 23px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cardio-fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.when { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.when input { height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: inherit; padding: 0 10px; font: inherit; }
.cardio-fields label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.badge.c { background: var(--both); color: #fff; font-family: var(--font-body); font-size: 13px; padding: 4px 8px; }
.prog { display: grid; grid-template-columns: 1fr auto 96px; gap: 10px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.prog:first-of-type { border-top: 0; }
.prog .nm { min-width: 0; font-size: 14px; }
.prog svg { width: 96px; height: 28px; overflow: visible; }
.empty { color: var(--muted); font-size: 14px; }
details summary { cursor: pointer; font-weight: 600; }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px; font-family: var(--font-num); font-size: 12px; direction: ltr; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 9;
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
}
@media (max-width: 380px) {
  .ex-head { grid-template-columns: 92px 1fr; }
  .pic { width: 92px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<!--/APP-HEAD-->
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>אימון <b>A</b></h1>
      <span class="note" id="syncNote" style="margin-inline-start:auto"></span>
      <button class="tab" id="tabS" data-view="S" aria-label="הגדרות" style="align-self:center">⚙︎ הגדרות</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabA" data-view="A">אימון A</button>
      <button class="tab" role="tab" id="tabB" data-view="B">אימון B</button>
      <button class="tab" role="tab" id="tabC" data-view="C">אירובי</button>
      <button class="tab" role="tab" id="tabH" data-view="H">היסטוריה</button>
    </div>
    <div class="progress" id="progressRow">
      <div class="bar"><i id="barFill"></i></div>
      <span class="num" id="progressTxt">0/0</span>
    </div>
  </header>

  <main id="workout" class="wrap" style="margin:0"></main>
  <section id="cardio" class="wrap" style="margin:0" hidden></section>
  <section id="history" class="wrap" style="margin:0" hidden></section>
  <section id="settings" class="wrap" style="margin:0" hidden></section>
</div>

<div class="rest" id="rest" hidden>
  <span class="clock" id="restClock">1:30</span>
  <span class="lbl" id="restLbl">מנוחה בין סטים</span>
  <button id="restAdd">+30″</button>
  <button id="restSkip">דלג</button>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script>
(() => {
'use strict';

// ---------- Program (from the A/B card: 4×/week, 60 min, warmup 5 min, 2 sets × 8-12, 90″ rest, 50-70%) ----------
const IMG = 'img/';
const EX = {
  legpress:  { he: 'לחיצת רגליים במכונה', en: 'Leg Press', img: 'Leg_Press' },
  legext:    { he: 'פשיטת ברכיים במכונה', en: 'Leg Extension', img: 'Leg_Extensions' },
  legcurl:   { he: 'כפיפת ברכיים במכונה', en: 'Leg Curl', img: 'Seated_Leg_Curl' },
  calves:    { he: 'תאומים', en: 'Calf Raise', img: 'Standing_Calf_Raises' },
  dbbench:   { he: 'לחיצת חזה במשקולות', en: 'Dumbbell Bench Press', img: 'Dumbbell_Bench_Press' },
  incdb:     { he: 'לחיצת חזה בשיפוע במשקולות', en: 'Incline Dumbbell Press', img: 'Incline_Dumbbell_Press' },
  pecfly:    { he: 'פרפר חזה במכונה', en: 'Pec Deck / Butterfly', img: 'Butterfly' },
  shpress:   { he: 'לחיצת כתפיים במשקולות', en: 'Dumbbell Shoulder Press', img: 'Dumbbell_Shoulder_Press' },
  lateral:   { he: 'הרחקת כתפיים במשקולות', en: 'Lateral Raise', img: 'Side_Lateral_Raise' },
  pushdown:  { he: 'פשיטת מרפקים בכבל קרוס', en: 'Cable Triceps Pushdown', img: 'Triceps_Pushdown' },
  ohext:     { he: 'פשיטת מרפקים במשקולת', en: 'Overhead Dumbbell Extension', img: 'Standing_Dumbbell_Triceps_Extension' },
  latpull:   { he: 'פולי עליון באחיזה רחבה', en: 'Wide-Grip Lat Pulldown', img: 'Wide-Grip_Lat_Pulldown' },
  row:       { he: 'חתירה במכונה', en: 'Machine Row', img: 'Leverage_Iso_Row' },
  pullover:  { he: 'פול אובר במשקולת', en: 'Dumbbell Pullover', img: 'Straight-Arm_Dumbbell_Pullover' },
  lowback:   { he: 'גב תחתון במשקולת', en: 'Back Extension', img: 'Hyperextensions_Back_Extensions' },
  reardelt:  { he: 'כתף אחורית במכונת פרפר', en: 'Reverse Pec Deck', img: 'Reverse_Machine_Flyes' },
  curl:      { he: 'כפיפת מרפקים במשקולות', en: 'Dumbbell Biceps Curl', img: 'Dumbbell_Bicep_Curl' },
  hammer:    { he: 'כפיפת מרפקים בפטישים', en: 'Hammer Curl', img: 'Hammer_Curls' },
};
const PLAN = {
  A: [
    ['רגליים', ['legpress', 'legext', 'legcurl', 'calves']],
    ['חזה', ['dbbench', 'incdb', 'pecfly']],
    ['יד אחורית', ['pushdown', 'ohext']],
  ],
  B: [
    ['גב', ['latpull', 'row', 'pullover', 'lowback']],
    ['כתפיים', ['shpress', 'lateral', 'reardelt']],
    ['יד קדמית', ['curl', 'hammer']],
  ],
};
// Exercises the viewer added live in settings.custom ({ he, day, group }) and are mirrored into EX
const customIn = (day, group) => Object.keys(state.settings.custom || {}).filter(id => state.settings.custom[id].day === day && state.settings.custom[id].group === group);
function syncCustom() {
  Object.keys(EX).forEach(id => { if (EX[id].custom) delete EX[id]; });
  Object.entries(state.settings.custom || {}).forEach(([id, c]) => { EX[id] = { he: c.he || 'תרגיל חדש', en: '', img: null, custom: true }; });
}
const allIn = (day, group, ids) => [...ids, ...customIn(day, group)];
function plan(day) {
  return PLAN[day].map(([g, ids]) => [g, allIn(day, g, ids).filter(id => !state.settings.off[id])]).filter(([, ids]) => ids.length);
}
const exName = id => (state.settings.names[id] || '').trim() || (EX[id] ? EX[id].he : 'תרגיל שנמחק');
const SETS_DEFAULT = 2, SETS_MAX = 2, REP_TOP = 12, REST_SEC = 90;

// ---------- Storage: localStorage always, plus the artifact's private db when it is available ----------
// Cloud layout (one flat per-viewer collection data/users/<uid>):
//   "drafts"   { drafts, updated }   the workouts in progress
//   "s_<id>"   one finished session
//   "p_<exId>" { src }               a custom exercise photo
// On load the newer of local and cloud wins, and sessions/photos are merged, so a reload never drops data.
const APP_VERSION = '10.11.2026-2';
const LS_KEY = 'gymAB.v1';
let state = { sessions: [], drafts: {}, photos: {}, updated: 0, settings: { off: {}, names: {}, custom: {}, updated: 0 } };
let storageOk = true;
function lsRead() { try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && Array.isArray(s.sessions)) return s; } catch (e) {} return null; }
function lsWrite() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { if (storageOk) { storageOk = false; showSaveProblem(); } }
}
function touch() { state.updated = Date.now(); lsWrite(); }

const cloud = { col: null, queues: {}, pending: 0 };
function cloudWrite(key, fn) {
  if (!cloud.col) return;
  cloud.pending++; setSync('שומר…');
  const prev = cloud.queues[key] || Promise.resolve();
  cloud.queues[key] = prev.then(fn).then(
    () => { if (--cloud.pending === 0) setSync('נשמר ✓'); },
    err => { cloud.pending--; console.warn('db', key, err); setSync('לא נשמר בענן (נשמר במכשיר)'); },
  );
}
async function cloudInit() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    const col = db.collection('data/users/' + uid);
    const snap = await col.get();
    const remote = { sessions: [], photos: {}, drafts: {}, updated: 0 };
    snap.docs.forEach(d => {
      const v = d.data(); if (!v) return;
      if (d.id === 'drafts') { remote.drafts = v.drafts || {}; remote.updated = v.updated || 0; }
      else if (d.id.startsWith('s_') && v.id) remote.sessions.push(v);
      else if (d.id.startsWith('p_') && v.src) remote.photos[d.id.slice(2)] = v.src;
      else if (d.id === 'settings' && v.updated) remote.settings = v;
    });
    cloud.col = col;
    // Sessions and photos: union of both sides; upload what only this device has.
    const haveRemote = new Set(remote.sessions.map(x => x.id));
    const localOnly = state.sessions.filter(x => !haveRemote.has(x.id));
    const haveLocal = new Set(state.sessions.map(x => x.id));
    state.sessions.push(...remote.sessions.filter(x => !haveLocal.has(x.id)));
    localOnly.forEach(saveSessionRemote);
    Object.entries(state.photos).forEach(([k, v]) => { if (!remote.photos[k]) savePhotoRemote(k, v); });
    state.photos = Object.assign({}, remote.photos, state.photos);
    if (remote.settings && remote.settings.updated > (state.settings.updated || 0)) { state.settings = Object.assign({ off: {}, names: {}, custom: {} }, remote.settings); syncCustom(); applyTheme(); }
    else if (state.settings.updated) saveSettingsRemote();
    // Workouts in progress: the newer side wins.
    if ((remote.updated || 0) > (state.updated || 0)) {
      Object.values(remote.drafts).forEach(d => d && d.ex && Object.values(d.ex).forEach(sets => sets.splice(SETS_MAX)));
      state.drafts = remote.drafts; state.updated = remote.updated;
    } else if (state.updated) {
      saveDraftsRemote();
    }
    lsWrite();
    if (!cloud.pending) setSync('נשמר ✓');
    render();
  } catch (e) { console.warn('db init', e); }
}
function saveSettingsRemote() { const body = JSON.parse(JSON.stringify(state.settings)); cloudWrite('settings', () => cloud.col.doc('settings').set(body)); }
function saveSettings() { state.settings.updated = Date.now(); lsWrite(); saveSettingsRemote(); }
function saveSessionRemote(s) { cloudWrite('s_' + s.id, () => cloud.col.doc('s_' + s.id).set(s)); }
function saveDraftsRemote() {
  clearTimeout(draftTimer); draftTimer = null;
  const body = JSON.parse(JSON.stringify({ drafts: state.drafts, updated: state.updated || Date.now() }));
  cloudWrite('drafts', () => cloud.col.doc('drafts').set(body));
}
function savePhotoRemote(id, src) {
  cloudWrite('p_' + id, () => src ? cloud.col.doc('p_' + id).set({ src }) : cloud.col.doc('p_' + id).delete());
}
let draftTimer = null;
function saveDrafts() {
  touch();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftsRemote, 600);
}
// Leaving or hiding the page sends any change still waiting for the timer.
function flush() { if (draftTimer) saveDraftsRemote(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);
function showSaveProblem() {
  setTimeout(() => toast('הדפדפן הזה לא שומר נתונים (מצב גלישה פרטית?). פתח את האתר בדפדפן רגיל.'), 300);
}

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });
const sorted = () => state.sessions.slice().sort((a, b) => a.date < b.date ? 1 : -1);
function setSync(t) { $('#syncNote').textContent = t; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

function lastFor(exId) {
  for (const s of sorted()) if (s.ex && s.ex[exId] && s.ex[exId].length) return { date: s.date, sets: s.ex[exId] };
  return null;
}
function nextDay() { const l = sorted().find(s => s.day === 'A' || s.day === 'B'); return l && l.day === 'A' ? 'B' : 'A'; }

function draftFor(day) {
  let d = state.drafts[day];
  if (!d) {
    d = { start: null, warm: false, ex: {} };
    plan(day).forEach(([, ids]) => ids.forEach(id => {
      const last = lastFor(id);
      const n = last ? Math.min(Math.max(last.sets.length, SETS_DEFAULT), SETS_MAX) : SETS_DEFAULT;
      d.ex[id] = Array.from({ length: n }, (_, i) => {
        const p = last && (last.sets[i] || last.sets[last.sets.length - 1]);
        return { w: p && p.w !== '' && p.w != null ? String(p.w) : '', r: '', done: false };
      });
    }));
    state.drafts[day] = d;
  }
  const inPlan = new Set(plan(day).flatMap(([, ids]) => ids));
  Object.keys(d.ex).forEach(id => { if (!inPlan.has(id)) delete d.ex[id]; });
  // Exercises added to the plan after this draft was started
  plan(day).forEach(([, ids]) => ids.forEach(id => {
    if (!d.ex[id]) d.ex[id] = Array.from({ length: SETS_DEFAULT }, () => ({ w: '', r: '', done: false }));
  }));
  return d;
}

// ---------- Rendering ----------
let view = null;
const openGroups = new Set();  // folders the viewer opened, e.g. "A0
function render() {
  if (!view) view = nextDay();
  ['A', 'B', 'C', 'H', 'S'].forEach(v => $('#tab' + v).setAttribute('aria-selected', String(view === v)));
  const nd = nextDay();
  ['A', 'B'].forEach(v => { $('#tab' + v).innerHTML = 'אימון ' + v + (v === nd ? '<span class="next">· הבא</span>' : ''); });
  const weights = view === 'A' || view === 'B';
  $('#workout').hidden = !weights;
  $('#cardio').hidden = view !== 'C';
  $('#history').hidden = view !== 'H';
  $('#settings').hidden = view !== 'S';
  $('#progressRow').hidden = !weights;
  $('h1').innerHTML = view === 'S' ? 'הגדרות' : view === 'H' ? 'היסטוריה' : view === 'C' ? '<b>אירובי</b>' : 'אימון <b>' + view + '</b>';
  if (view === 'S') renderSettings(); else if (view === 'H') renderHistory(); else if (view === 'C') renderCardio(); else renderWorkout(view);
}

function picHTML(id) {
  const e = EX[id], own = state.photos[id];
  const imgs = own
    ? `<img class="own" src="${esc(own)}" alt="${esc(exName(id))}">`
    : !e.img ? `<span class="noimg">🏋️</span>`
    : `<img src="${IMG}${e.img}_0.jpg" alt="${esc(exName(id))}" loading="lazy"><img class="b" src="${IMG}${e.img}_1.jpg" alt="" loading="lazy">`;
  return `<div class="pic${own ? ' own-pic' : ''}">${imgs}<button class="pic-btn" data-photo="${id}" aria-label="החלפת תמונה">📷</button>${own ? `<button class="pic-btn alt" data-photoreset="${id}" aria-label="חזרה לתמונה המקורית">↺</button>` : ''}</div>`;
}

function groupDone(day, gi) { const d = state.drafts[day]; return plan(day)[gi][1].every(id => d.ex[id].every(x => x.done)); }
function setFolder(key, open) {
  if (open) openGroups.add(key); else openGroups.delete(key);
  const fh = document.querySelector(`[data-folder="${key}"]`); if (!fh) return;
  const f = fh.parentElement;
  f.classList.toggle('open', open);
  fh.setAttribute('aria-expanded', String(open));
  f.querySelector('.folder-body').hidden = !open;
}

function renderWorkout(day) {
  const d = draftFor(day);
  if (!plan(day).some((_, gi) => openGroups.has(day + gi))) {
    const gi = plan(day).findIndex((_, i) => !groupDone(day, i));
    if (gi >= 0) openGroups.add(day + gi);
  }
  const ow = openWorkout();
  let html = ow && ow[0] === day ? `<button class="save-nag" id="nagSave">האימון פתוח כבר ${Math.round(ow[2])} דקות ועוד לא נשמר · <b>לשמור עכשיו</b></button>` : '';
  html += `
    <label class="warm">
      <input type="checkbox" id="warmChk" ${d.warm ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--done)">
      <span class="t"><b>חימום</b></span>
    </label>`;
  plan(day).forEach(([group, ids], gi) => {
    const key = day + gi, open = openGroups.has(key);
    html += `<section class="folder${open ? ' open' : ''}" data-group="${gi}">
      <button class="folder-head" data-folder="${key}" aria-expanded="${open}">

        <span class="fmeta">${ids.length} תרגילים</span>

  html += `<button class="primary" id="finishBtn">סיום אימון ${day}</button>
    <div class="row"><button class="link" id="resetDay">איפוס האימון הנוכחי</button></div>`;

  updateProgress(day);
}

// Sunday 00:00 of the current week
function weekStart0() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay()); return d; }

// Reps of set i last time (falls back to that session's last set)
function lastReps(last, i) { if (!last) return ''; const p = last.sets[i] || last.sets[last.sets.length - 1]; return p && p.r ? String(p.r) : ''; }

function exHTML(day, id) {
  const e = EX[id], sets = state.drafts[day].ex[id], last = lastFor(id);
  const complete = sets.length && sets.every(s => s.done);
  let lastTxt = '';
  let upTxt = '';
  if (last) {
    const s = last.sets.map(x => `${x.w}×` + (x.r || '?')).join(' · ');
    lastTxt = `<div class="last">פעם קודמת: <b class="num">${esc(s)}</b></div>`;
    if (last.sets.length && last.sets.every(x => +x.r >= REP_TOP)) upTxt = `<div class="up">הגעת ל-${REP_TOP} חזרות בכל הסטים. אפשר להעלות משקל.</div>`;
  }
  const rows = sets.map((s, i) => `
    <div class="set-row${s.done ? ' on' : ''}" data-ex="${id}" data-i="${i}">
      <span class="n">${i + 1}</span>
      <span class="field" data-u="ק״ג"><input id="w-${day}-${id}-${i}" inputmode="decimal" placeholder="—" value="${esc(s.w)}" data-k="w" aria-label="משקל סט ${i + 1}"></span>
      <span class="field" data-u="חזרות"><input id="r-${day}-${id}-${i}" inputmode="numeric" placeholder="${esc(lastReps(last, i) || '8-12')}" value="${esc(s.r)}" data-k="r" aria-label="חזרות סט ${i + 1}"></span>
      <button class="done-btn" data-done aria-label="סמן סט ${i + 1} כבוצע">✓</button>

  return `
  <article class="ex${complete ? ' complete' : ''}" id="ex-${id}">

      ${picHTML(id)}

        ${lastTxt}${upTxt}
      </div>
    </div>
    <div class="sets">${rows}</div>
  </article>`;
}

function updateProgress(day) {
  const d = state.drafts[day];
  let total = 0, done = 0;
  Object.values(d.ex).forEach(sets => sets.forEach(s => { total++; if (s.done) done++; }));
  $('#barFill').style.width = (total ? done / total * 100 : 0) + '%';
  $('#progressTxt').textContent = `${done}/${total} סטים`;
  document.querySelectorAll('#workout .folder').forEach(f => {
    const ids = plan(day)[+f.dataset.group][1];
    let t = 0, n = 0;
    ids.forEach(id => d.ex[id].forEach(s => { t++; if (s.done) n++; }));
    f.querySelector('.fcount').textContent = n === t ? '✓ הושלם' : `${n}/${t}`;
    f.classList.toggle('done', n === t);
  });
}

function spark(points) {
  if (points.length < 2) return '<svg viewBox="0 0 96 28"></svg>';
  const min = Math.min(...points), max = Math.max(...points), span = max - min || 1;
  const xy = points.map((p, i) => [i / (points.length - 1) * 92 + 2, 24 - (p - min) / span * 20]);
  const line = xy.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const [lx, ly] = xy[xy.length - 1];
  return `<svg viewBox="0 0 96 28" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--accent)"/></svg>`;
}

// ---------- Training days calendar: one cell per day, a column per week, Jan → Dec ----------
// Every training day (weights, cardio or a marked day) is one colour.
const dayKey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const HE_MONTHS = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ'];
function heatYear(year, days, todayKey) {
  const C = 7, jan1 = new Date(year, 0, 1), off = jan1.getDay();
  let cells = '', labels = '', n = 0;
  for (let d = new Date(jan1); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
    const i = Math.round((d - jan1) / 864e5) + off, col = Math.floor(i / 7), row = d.getDay(), k = dayKey(d), v = days.get(k);
    if (d.getDate() === 1) labels += `<text class="lbl" x="${col * C + 9}" y="9" text-anchor="middle">${HE_MONTHS[d.getMonth()]}</text>`;
    if (v) n++;
    cells += `<rect class="c${v === 3 ? ' both' : v ? ' on' : ''}${k === todayKey ? ' today' : ''}" x="${col * C}" y="${14 + row * C}" width="${C - 1.2}" height="${C - 1.2}" rx="1.2"/>`;
  }
  return `<div class="heat-year"><div class="hist-row"><b>${year}</b><span class="d num">${n} ימים</span></div>
    <div class="heat"><svg viewBox="-3 0 ${54 * C + 3} ${14 + 7 * C}" role="img" aria-label="${n} ימי אימון ב-${year}">${labels}${cells}</svg></div></div>`;
}
function heatHTML(list) {
  const days = new Map();  // dayKey → 1 weights, 2 cardio, 3 both
  list.forEach(s => { const k = dayKey(new Date(s.date)); days.set(k, 1); });
  const now = new Date(), todayKey = dayKey(now), thisYear = now.getFullYear();
  const oldest = list.length ? new Date(list[list.length - 1].date) : now;
  const inYear = [...days.keys()].filter(k => k.startsWith(thisYear + '-')).length;
  // Weeks in a row (Sunday–Saturday) with at least one training day; the current week counts once it has one
  const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x.getTime(); };
  const weeks = new Set(list.map(s => weekStart(new Date(s.date))));
  let w = weekStart(now), streak = 0;
  if (!weeks.has(w)) w -= 7 * 864e5;
  while (weeks.has(w)) { streak++; const x = new Date(w); x.setDate(x.getDate() - 7); w = x.getTime(); }
  let body = '';
  for (let y = thisYear; y >= oldest.getFullYear(); y--) body += heatYear(y, days, todayKey);
  return `<div class="card"><h3>ימי אימון</h3>
    <div class="heat-stats"><div><b>${days.size}</b><span>ימים בסך הכול</span></div><div><b>${inYear}</b><span>השנה</span></div><div><b>${streak}</b><span>שבועות ברצף</span></div></div>
    <div class="heat-legend"><span><i></i>יום אימון</span></div>
    ${body}</div>`;
}

// ---------- Cardio ----------
const CARDIO_TYPES = ['הליכון', 'אופניים', 'אליפטיקל', 'ריצה', 'מדרגות', 'חתירה', 'שחייה', 'אחר'];
let cardioType = null;
const isoDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

}

    </div>
    <button class="primary" id="saveCardio">שמירת אירובי</button>
    <div class="card">
      <div class="hist-row"><h3>השבוע</h3><span class="num">${week.length} פעמים · ${weekMin} דק׳</span></div>
      ${list.length ? list.slice(0, 5).map(s => `<div class="hist-row"><span>${esc(s.type)} · ${fmtDate(s.date)}</span><span class="num d">${s.min} דק׳${s.km ? ' · ' + esc(s.km) + ' ק״מ' : ''}${s.inc ? ' · שיפוע ' + esc(s.inc) + '%' : ''}</span></div>`).join('') : '<p class="empty">עוד לא נשמר אירובי.</p>'}
    </div>`;
}
$('#cardio').addEventListener('click', e => {
  const chip = e.target.closest('[data-ctype]');
  if (chip) { cardioType = chip.dataset.ctype; document.querySelectorAll('#cardio .chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip))); return; }
  const cday = e.target.closest('[data-cday]');
  if (cday) { const d = new Date(); d.setDate(d.getDate() - +cday.dataset.cday); $('#cDate').value = isoDay(d); syncWhenChips(); return; }
  if (e.target.id !== 'saveCardio') return;
  const min = Math.round(+$('#cMin').value.replace(',', '.'));
  const km = $('#cKm').value.replace(',', '.').trim(), inc = $('#cInc').value.replace(',', '.').trim();
  if (!(min > 0)) { toast('כמה דקות עשית?'); $('#cMin').focus(); return; }
  // A past day is stored at noon so it lands on that day in the calendar
  const now = new Date(), picked = $('#cDate').value;
  let when = now;

// ---------- Rest timer ----------
let restEnd = 0, restTick = null;
let restNotified = false, audio = null, swReg = null;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.claude) {
  // A new version takes over as soon as it is installed; reload once so the screen shows it
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
}
// Asked once, from a tap (the first ✓ or the settings button), because browsers only allow it then
function askNotify(fromButton) {
  if (!('Notification' in window) || Notification.permission !== 'default') return;
  try { Notification.requestPermission().then(() => { if (fromButton || view === 'S') render(); }); } catch (e) {}
}
function beep() {
  try {
    const ctx = audio || (audio = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25, .5].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .2);
    });
  } catch (e) {}
}
function restOver() {
  if (restNotified) return; restNotified = true;
  beep();
  if (navigator.vibrate) { try { navigator.vibrate([300, 120, 300]); } catch (e) {} }
  notify('המנוחה נגמרה', 'זמן לסט הבא 💪', 'rest');
}
function notify(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, renotify: true, icon: 'icon-192.png', badge: 'icon-192.png' };
  try { if (swReg) swReg.showNotification(title, opts); else new Notification(title, opts); } catch (e) {}
}

// ---------- Unsaved workout reminder: 90 minutes after the first set, then every 30, up to 4 hours ----------
const SAVE_FIRST = 90, SAVE_EVERY = 30, SAVE_STOP = 240;
function openWorkout() {
  // The A/B workout that is in progress: started, has a ticked set, not saved yet
  return ['A', 'B'].map(day => [day, state.drafts[day]])
    .filter(([, d]) => d && d.start && Object.values(d.ex || {}).some(x => x.some(y => y.done)))
    .map(([day, d]) => [day, d, (Date.now() - new Date(d.start)) / 60000])
    .filter(([, , min]) => min >= SAVE_FIRST && min < SAVE_STOP)[0] || null;
}
function checkUnsaved() {
  const w = openWorkout(); if (!w) return;
  const [day, d, min] = w;
  const due = Math.floor((min - SAVE_FIRST) / SAVE_EVERY);  // 0 at 90 min, 1 at 120, ...
  if ((d.reminded ?? -1) >= due) return;
  d.reminded = due; touch();
  beep();
  notify('שכחת לשמור את האימון?', `אימון ${day} פתוח כבר ${Math.round(min)} דקות. היכנס ולחץ "סיום אימון".`, 'save');
  toast(`אימון ${day} עוד לא נשמר. לחץ "סיום אימון" למטה`);
}
setInterval(checkUnsaved, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUnsaved(); if (view === 'A' || view === 'B') render(); } });
let restTimeout = null;
function startRest(sec) {
  restEnd = Date.now() + sec * 1000;
  restNotified = false;
  askNotify(false);
  // Unlock audio while we are inside the tap that started the rest
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  clearTimeout(restTimeout); restTimeout = setTimeout(restOver, sec * 1000);
  $('#rest').hidden = false;
  clearInterval(restTick);
  restTick = setInterval(drawRest, 250);
  drawRest();
}
function drawRest() {
  const left = Math.round((restEnd - Date.now()) / 1000);
  const a = Math.abs(left);
  $('#restClock').textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + String(a % 60).padStart(2, '0');
  $('#rest').classList.toggle('over', left < 0);
  $('#restLbl').textContent = left < 0 ? 'זמן לסט הבא' : 'מנוחה בין סטים';
  if (left <= 0) restOver();
  if (left < -120) stopRest();
}
function stopRest() { clearInterval(restTick); clearTimeout(restTimeout); $('#rest').hidden = true; }
$('#restSkip').onclick = stopRest;
$('#restAdd').onclick = () => {
  restEnd += 30000; restNotified = restEnd <= Date.now() && restNotified;
  clearTimeout(restTimeout); restTimeout = setTimeout(restOver, Math.max(0, restEnd - Date.now()));
  drawRest();
};

  if (t.closest('[data-done]')) {
    const row = t.closest('.set-row'), id = row.dataset.ex, i = +row.dataset.i, set = d.ex[id][i];
    set.done = !set.done;
    if (set.done && !set.r) { const r = lastReps(lastFor(id), i); if (r) { set.r = r; row.querySelector('[data-k="r"]').value = r; } }
    if (!d.start) d.start = new Date().toISOString();

    card.classList.toggle('complete', d.ex[id].every(s => s.done));
    updateProgress(view);
    saveDrafts();
    if (set.done) startRest(REST_SEC);
    const gi = plan(view).findIndex(([, ids]) => ids.includes(id));
    if (set.done && groupDone(view, gi)) {
      const next = plan(view).findIndex((_, k) => k > gi && !groupDone(view, k));
      setTimeout(() => {
        setFolder(view + gi, false);
        if (next >= 0) { setFolder(view + next, true); document.querySelector(`[data-group="${next}"]`).scrollIntoView({ behavior: 'smooth', block: 'start' }); }

      }, 600);

    return;
  }
  const add = t.closest('[data-add]'), del = t.closest('[data-del]');
  if (add || del) {
    const id = (add || del).dataset[add ? 'add' : 'del'], sets = d.ex[id];
    if (add && sets.length < SETS_MAX) { const p = sets[sets.length - 1]; sets.push({ w: p ? p.w : '', r: '', done: false }); }
    if (del && sets.length > 1) sets.pop();
    saveDrafts();
    $('#ex-' + id).outerHTML = exHTML(view, id);
    updateProgress(view);
    return;
  }
  const fh = t.closest('[data-folder]');
  if (fh) { setFolder(fh.dataset.folder, !openGroups.has(fh.dataset.folder)); return; }
  const ph = t.closest('[data-photo]');

  if (ph) { photoTarget = ph.dataset.photo; $('#photoInput').value = ''; $('#photoInput').click(); return; }
  if (t.id === 'finishBtn' || t.closest('#nagSave')) return finish(view);
  if (t.id === 'resetDay') {
    if (t.dataset.armed) { delete state.drafts[view]; saveDrafts(); render(); toast('האימון אופס'); }
    else { t.dataset.armed = '1'; t.textContent = 'לחץ שוב לאישור האיפוס'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'איפוס האימון הנוכחי'; } }, 3000); }
  }
});

function finish(day) {
  const d = draftFor(day), ex = {};
  Object.entries(d.ex).forEach(([id, sets]) => {
    const done = sets.filter(s => s.done).map(s => ({ w: s.w, r: s.r }));
    if (done.length) ex[id] = done;
  });
  if (!Object.keys(ex).length) { toast('סמן לפחות סט אחד לפני סיום'); return; }
  const now = new Date();
  const min = d.start ? Math.max(1, Math.round((now - new Date(d.start)) / 60000)) : null;
  const s = { id: 's' + now.getTime(), day, date: now.toISOString(), min: min && min < 240 ? min : null, ex };
  state.sessions.push(s);
  delete state.drafts[day];
  touch(); saveSessionRemote(s); saveDraftsRemote();
  stopRest();
  view = 'H'; render(); window.scrollTo(0, 0);
  toast(`אימון ${day} נשמר. הבא בתור: ${day === 'A' ? 'B' : 'A'}`);
}

    if (!ds.dataset.armed) { ds.dataset.armed = '1'; ds.textContent = 'לחץ שוב למחיקה'; return; }
    const id = ds.dataset.delsession;
    state.sessions = state.sessions.filter(s => s.id !== id);
    touch(); cloudWrite('s_' + id, () => cloud.col.doc('s_' + id).delete());
    render(); return;
  }
  // Old weights go, the training days stay: sessions keep their date but lose their sets
  if (t.id === 'clearWeights') {
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'לחץ שוב לאישור האיפוס'; return; }
    const ws = new Date(); ws.setHours(0, 0, 0, 0); ws.setDate(ws.getDate() - ws.getDay());
    const old = state.sessions.filter(s => s.day !== 'C' && new Date(s.date) < ws && Object.keys(s.ex || {}).length);
    old.forEach(s => { s.ex = {}; s.cleared = true; saveSessionRemote(s); });
    // Workouts not started yet would still carry the old weights
    Object.keys(state.drafts).forEach(k => { const d = state.drafts[k]; if (!d || !Object.values(d.ex || {}).some(x => x.some(y => y.done))) delete state.drafts[k]; });
    touch(); saveDraftsRemote();
    render(); toast(`אופסו המשקלים מ-${old.length} אימונים`);
    return;
  }
  if (t.id === 'copyBackup') {
    const txt = JSON.stringify({ sessions: state.sessions });
    const ta = $('#backupTxt'); ta.value = txt;
    try { await navigator.clipboard.writeText(txt); toast('הגיבוי הועתק'); }
    catch (err) { ta.select(); toast('הגיבוי בתיבה. סמן והעתק ידנית'); }
  }
  if (t.id === 'restoreBackup') {
    try {
      const data = JSON.parse($('#backupTxt').value);
      if (!Array.isArray(data.sessions)) throw 0;
      const have = new Set(state.sessions.map(s => s.id));
      const add = data.sessions.filter(s => s && s.id && s.day && s.date && !have.has(s.id));
      state.sessions.push(...add); lsWrite(); add.forEach(saveSessionRemote);
      render(); toast(`שוחזרו ${add.length} אימונים`);
    } catch (err) { toast('הטקסט בתיבה אינו גיבוי תקין'); }
  }
});

// Own photo per exercise (resized so it stays small)
let photoTarget = null;
$('#photoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f || !photoTarget) return;
  const id = photoTarget, url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const s = Math.min(1, 480 / Math.max(im.width, im.height));
    const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const src = c.toDataURL('image/jpeg', .8);
    state.photos[id] = src; lsWrite(); savePhotoRemote(id, src);
    render(); toast('התמונה עודכנה');
  };
  im.onerror = () => toast('לא הצלחתי לפתוח את הקובץ הזה כתמונה');
  im.src = url;
});

// Two-frame demo: alternate start/end positions
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => document.querySelectorAll('#workout .pic:not(.own-pic)').forEach(p => p.classList.toggle('flip')), 1400);
}
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

// ---------- Boot ----------
try { localStorage.setItem('gymAB.test', '1'); localStorage.removeItem('gymAB.test'); } catch (e) { storageOk = false; showSaveProblem(); }
const saved = lsRead();
if (saved) state = { sessions: saved.sessions, drafts: saved.drafts || {}, photos: saved.photos || {}, updated: saved.updated || 0, settings: Object.assign({ off: {}, names: {}, custom: {}, updated: 0 }, saved.settings) };
syncCustom();
applyTheme();
// One-time cleanup (Nov 2026): keep the sets of the latest A and latest B only, older workouts keep their
// date for the calendar and streak, and two missed days (Thu 5.11 and Sun 8.11.2026) are marked as training days.
if (!state.settings.migr1) {
  const keep = new Set(['A', 'B'].map(d => (sorted().find(x => x.day === d) || {}).id));
  state.sessions.forEach(x => {
    if ((x.day === 'A' || x.day === 'B') && !keep.has(x.id) && Object.keys(x.ex || {}).length) { x.ex = {}; x.cleared = true; saveSessionRemote(x); }
  });
  [[2026, 10, 5], [2026, 10, 8]].forEach(([y, m, d]) => {
    const k = y + '-' + (m + 1) + '-' + d;
    if (state.sessions.some(x => { const t = new Date(x.date); return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate() === k; })) return;
    const x = { id: 'm' + y + (m + 1) + d, day: 'M', date: new Date(y, m, d, 12).toISOString(), ex: {} };
    state.sessions.push(x); saveSessionRemote(x);
  });
  Object.keys(state.drafts).forEach(k => { const dr = state.drafts[k]; if (!dr || !Object.values(dr.ex || {}).some(a => a.some(z => z.done))) delete state.drafts[k]; });
  state.settings.migr1 = true; touch();
}
// Drafts started under an older set count keep at most SETS_MAX sets
Object.values(state.drafts).forEach(d => d && d.ex && Object.values(d.ex).forEach(sets => sets.splice(SETS_MAX)));
render();
cloudInit();
})();
</script>
</body>
